## this file defines how to run our containers using docker-compose
## it builds the image from the Dockerfile and runs it with port 8000 exposed
## run with: docker-compose up --build
services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./app:/code/app
      - ./users.csv:/code/users.csv
      - ./menu_items.csv:/code/menu_items.csv
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - api
